appId: es.buhoai.gamestudio
productName: Búho Game Studio
copyright: © 2026 Buho Corps Systems
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - build/icon.png
# Agentic first: el CLI y su guía para agentes van dentro de la carpeta del programa
# (<instalación>\cli, que el instalador añade al PATH del usuario) y la guía también en la raíz.
extraFiles:
  - from: bin/buho-studio.mjs
    to: cli/buho-studio.mjs
  - from: build/cli
    to: cli
  - from: skills/buho-studio/SKILL.md
    to: cli/SKILL.md
  - from: skills/buho-studio/SKILL.md
    to: SKILL.md
win:
  icon: build/icon.png
  executableName: BuhoGameStudio
  legalTrademarks: Buho Corps Systems
  target:
    - target: nsis
      arch: [x64]
  artifactName: Buho-GameStudio-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Búho Game Studio
  include: build/installer.nsh
